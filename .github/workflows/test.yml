name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
      - name: Offline baseline smoke (no API keys)
        run: uv run python inference.py --dry-run --max-variations 2
